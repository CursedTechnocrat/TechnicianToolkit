name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $settings = Join-Path $env:GITHUB_WORKSPACE '.github\PSScriptAnalyzerSettings.psd1'
          $results  = Invoke-ScriptAnalyzer -Path $env:GITHUB_WORKSPACE `
                          -Recurse `
                          -Settings $settings `
                          -ExcludeRule PSAvoidUsingWriteHost

          if ($results) {
            $results | Format-Table -AutoSize
            $errors = $results | Where-Object { $_.Severity -eq 'Error' }
            if ($errors) {
              Write-Error "PSScriptAnalyzer found $($errors.Count) error(s). Failing build."
              exit 1
            } else {
              Write-Warning "PSScriptAnalyzer found $($results.Count) warning(s). Review above."
            }
          } else {
            Write-Host "PSScriptAnalyzer: no issues found." -ForegroundColor Green
          }

  test:
    name: Pester Tests
    runs-on: windows-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Scope CurrentUser -Force -MinimumVersion 5.0 -ErrorAction Stop

      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path        = Join-Path $env:GITHUB_WORKSPACE 'tests'
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled    = $true
          $config.TestResult.OutputPath = 'TestResults.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'

          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) {
            Write-Error "$($result.FailedCount) Pester test(s) failed."
            exit 1
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: TestResults.xml

  app:
    name: Desktop app
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build app/TechnicianToolkit.slnx -c Release --nologo

      # The AST readers and the extractor, headless. The Pester suite guards the
      # scripts; this guards the C# that reads them. Neither sees the other's
      # regressions -- a param() block the form builder misreads is valid
      # PowerShell, so nothing on the script side would notice.
      - name: Run engine unit tests
        run: >
          dotnet test app/TechnicianToolkit.Engine.Tests -c Release --no-build --nologo
          --logger "trx;LogFileName=engine-tests.trx" --results-directory TestResults

      - name: Upload engine test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-results
          path: TestResults/engine-tests.trx

      # Publishing single-file is the configuration under test, not just a
      # packaging step. Microsoft does not support Microsoft.PowerShell.SDK
      # together with PublishSingleFile, and phase 00 found two failures that
      # only appear in a published bundle. A plain build would catch neither.
      - name: Publish single-file harness
        run: >
          dotnet publish app/TechnicianToolkit.Harness -c Release -r win-x64
          -o publish/harness --nologo

      # THE GATE. Opens a real runspace, constructs the host, and resolves
      # Get-CimInstance. Without IncludeAllContentForSelfExtract the host
      # constructor throws; without the module remap the CIM call fails. Either
      # regression -- an SDK bump, a property dropped from the .csproj -- fails
      # here rather than in the field.
      - name: Probe the hosted engine
        run: ./publish/harness/TechnicianToolkit.Harness.exe probe

      - name: Read the tool catalog
        shell: pwsh
        run: |
          $out = ./publish/harness/TechnicianToolkit.Harness.exe list
          $out
          if ($LASTEXITCODE -ne 0) { Write-Error 'catalog listing failed'; exit 1 }
          # -match on a collection filters it and returns the matching items;
          # only a single string gives back a boolean. Left as an array, the
          # non-matching lines come back, which is truthy, and the check fires
          # even when the text is present. Join before matching.
          if (($out -join "`n") -notmatch 'tools in the registry') {
            Write-Error 'catalog listing produced no registry count'
            exit 1
          }

      # Round-trips a value through Get-TKConfig and Set-TKConfig, which is the
      # path the settings screen writes on. It also proves config.json survives
      # re-extraction -- it is seeded once and preserved, and a regression there
      # would silently wipe a technician's settings on the next launch.
      - name: Round-trip the configuration
        shell: pwsh
        run: |
          $exe = './publish/harness/TechnicianToolkit.Harness.exe'
          & $exe config set OrgName 'CI Round Trip'
          if ($LASTEXITCODE -ne 0) { Write-Error 'config write failed'; exit 1 }
          $after = & $exe config
          $after
          if (($after -join "`n") -notmatch 'CI Round Trip') {
            Write-Error 'the value did not survive being read back'
            exit 1
          }

      # asInvoker so the render runs without a UAC prompt the runner cannot answer.
      - name: Publish single-file window
        run: >
          dotnet publish app/TechnicianToolkit.App -c Release -r win-x64
          -p:Elevate=false -o publish/app --nologo

      - name: Render the window
        shell: pwsh
        run: |
          $exe = './publish/app/TechnicianToolkit.exe'
          $png = 'window.png'
          $p = Start-Process -FilePath $exe -ArgumentList @('--screenshot', $png) -PassThru -Wait
          if (Test-Path "$png.error.txt") { Get-Content "$png.error.txt"; Write-Error 'render failed'; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "render exited $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path $png)) { Write-Error 'no image produced'; exit 1 }
          Write-Host "rendered $((Get-Item $png).Length) bytes"

      # A XAML resource that fails to resolve, or a control template that throws,
      # shows up as a broken image rather than a broken build. Keeping the render
      # means a human can look at what CI actually produced.
      - name: Upload the render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-render
          path: window.png
