# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
#
# Installer manifest.
#
# InstallerType is 'portable': the application is a single self-contained .exe
# that installs nothing, writes its working files beside itself, and is removed
# by deleting it. Do not change this to 'exe' -- that would tell winget to run
# the binary with installer switches it does not have, and the toolkit would
# launch its window during 'winget install'.
#
# The hashes are the SHA-256 of the files attached to the GitHub release,
# computed AFTER signing -- signing appends to the PE and changes the hash.
# GitHub's own digest of each release asset must match them. Once the package
# is in winget-pkgs, generate this file with `wingetcreate update` against the
# published URLs rather than editing the hashes by hand; see RELEASING.md step 8.
#
# SPDX-License-Identifier: GPL-3.0-or-later

PackageIdentifier: CursedTechnocrat.TechnicianToolkit
PackageVersion: 6.0.0

MinimumOSVersion: 10.0.17763.0
InstallerType: portable
UpgradeBehavior: install
ReleaseDate: 2026-10-11

# The command alias winget creates. For a bare portable executable this is the
# root-level field; PortableCommandAlias belongs to NestedInstallerFiles, which
# is only for a portable shipped inside a zip -- winget reports it as an unknown
# field here. Without either, the alias is derived from the file name.
Commands:
  - techniciantoolkit

InstallModes:
  - interactive

Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/CursedTechnocrat/TechnicianToolkit/releases/download/v6.0.0/TechnicianToolkit-6.0.0-win-x64.exe
    InstallerSha256: 650BA1CAC1B5ECD0F5298BBD53492528191BEABD122A3D3A53AFE0617F6A5365

  # Built by CI but not yet run on real ARM hardware. Shipping it is deliberate
  # -- see the ARM64 row in docs/desktop-port.md and the request for a field
  # report in CONTRIBUTING.md.
  - Architecture: arm64
    InstallerUrl: https://github.com/CursedTechnocrat/TechnicianToolkit/releases/download/v6.0.0/TechnicianToolkit-6.0.0-win-arm64.exe
    InstallerSha256: C8E626DB732F131E9504B90A61D46C8A21051D032507E8F37417A001185EDD28

ManifestType: installer
ManifestVersion: 1.6.0
